# Optional. `docker run` works standalone and is the documented path:
#
#     docker run -d --name derate --network host --gpus all --pid=host \
#       --restart unless-stopped \
#       -v derate:/data \
#       -v "$HOME/.config/sparkrun:/root/.config/sparkrun:ro" \
#       -v "$HOME/.ssh:/root/.ssh:ro" \
#       ghcr.io/pizzaman213/derate/node
#
# This file exists for the single-node case and for people who prefer compose.
# It is never required: a compose file you must have is a configuration step,
# and the pitch is that there are none.

services:
  node:
    image: ghcr.io/pizzaman213/derate/node:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: derate

    # Not optional. mDNS is multicast and does not cross a bridge, and the
    # agent needs the real interfaces to report ConnectX-7 topology. The
    # container refuses to start without it.
    network_mode: host

    # Also not optional, and it fails quietly rather than loudly. Without the
    # GPU the container has no nvidia-smi, and a node with no nvidia-smi probes
    # as an unknown device class: no GPU name, zero memory, zero power, zero
    # temperature. It still joins and still reports healthy -- it is simply
    # never planned onto, and nothing anywhere says why.
    #
    # `pid: host` is part of the same requirement. On GB10 the aggregate FB
    # memory fields all read [N/A], so per-process accounting is the only way
    # to tell a resident model from the desktop, and nvidia-smi only reports
    # processes inside its own PID namespace -- which, in a container, is none
    # of the ones that matter.
    gpus: all
    pid: host

    restart: unless-stopped

    volumes:
      # Cluster token, node registry, link measurements, deployment records,
      # resolved-shape cache, synthesized recipes, telemetry journal and
      # archive.
      #
      # NOT the log files: paths.py::logs_dir() puts node.log and proxy.log at
      # <project root>/logs, which in this image is /opt/derate/logs -- a layer,
      # so `docker rm` takes them. Set DERATE_LOG_DIR=/data/logs below to keep
      # them here with everything else.
      - derate:/data
      # The host's sparkrun config, read-only: registries, saved clusters,
      # container image defaults.
      - ${HOME}/.config/sparkrun:/root/.config/sparkrun:ro
      # sparkrun drives the cluster over SSH.
      - ${HOME}/.ssh:/root/.ssh:ro
      # The host's docker socket, so this node can start a model. sparkrun runs
      # `docker` itself -- inspect, then run -- and inside a container that
      # client has no daemon unless the host's is handed in. The container it
      # starts is then a sibling on the host, not a child in here.
      #
      # Said plainly, because it is real: the docker API is root-equivalent on
      # the host. Without this line the node still joins and still reports its
      # hardware; it simply cannot launch, and says so.
      - /var/run/docker.sock:/var/run/docker.sock
      # The model cache the runtime downloads into. Read-WRITE, unlike the two
      # above, and deliberately: the Storage tab's whole purpose for this mount
      # is deleting weights, and 894 GiB of them is the largest thing on a
      # serving box by orders of magnitude. Without it the node reports "no
      # model cache" honestly and nothing breaks -- it simply cannot see or
      # reclaim what the runtime downloaded.
      #
      # At the SAME path it has on the host, with HF_HOME below pointing at it.
      # sparkrun resolves the cache as ${HF_HOME:-$HOME/.cache/huggingface} and
      # gives the answer to the host's daemon as a bind mount, so a container
      # that saw the cache at /root/.cache/... would send the host a path that
      # is root's home, and every weight would be downloaded again into a
      # directory the Storage tab cannot see.
      - ${HOME}/.cache/huggingface:${HOME}/.cache/huggingface

    environment:
      # Every one has a working default; they are listed so they are
      # discoverable, not because they need setting.
      DERATE_ROLE: ${DERATE_ROLE:-auto}
      DERATE_PORT: ${DERATE_PORT:-8080}
      DERATE_AGENT_PORT: ${DERATE_AGENT_PORT:-8081}
      # Unset -> the coordinator generates a token on first run and prints it.
      DERATE_TOKEN: ${DERATE_TOKEN:-}
      # Unset -> discover the coordinator over mDNS. Set to an address to skip
      # discovery when the other node is on a different subnet.
      DERATE_JOIN: ${DERATE_JOIN:-}
      # The other half of the cache mount above: one path, agreed on both sides,
      # so the runtime, the node agent and the operator see the same bytes.
      HF_HOME: ${HOME}/.cache/huggingface
      DERATE_LOG_LEVEL: ${DERATE_LOG_LEVEL:-INFO}
      # Unset -> <project root>/logs, which is /opt/derate/logs in this image:
      # a layer, so `docker rm` takes node.log and proxy.log with it. Set it to
      # /data/logs to keep them on the volume above.
      DERATE_LOG_DIR: ${DERATE_LOG_DIR:-}
      # Durable telemetry. Every node journals to /data and the coordinator
      # collects it; these bound how much of it is kept and for how long.
      DERATE_TELEMETRY: ${DERATE_TELEMETRY:-1}
      DERATE_TELEMETRY_RETENTION_DAYS: ${DERATE_TELEMETRY_RETENTION_DAYS:-30}
      DERATE_TELEMETRY_LOG_LEVEL: ${DERATE_TELEMETRY_LOG_LEVEL:-INFO}
      DERATE_TELEMETRY_MAX_BYTES: ${DERATE_TELEMETRY_MAX_BYTES:-}
      DERATE_TELEMETRY_SHIP_INTERVAL_S: ${DERATE_TELEMETRY_SHIP_INTERVAL_S:-5}
      # Logger prefixes never written to the journal. The default pair is one
      # row per HTTP request each, and the coordinator polls every node at
      # 1 Hz -- measured at 99.6% of the log stream and 81% of every row in the
      # archive, with the journal reaching its byte cap in ~30h against a 72h
      # retention. Set to "" to record everything again.
      DERATE_TELEMETRY_QUIET_LOGGERS: ${DERATE_TELEMETRY_QUIET_LOGGERS-uvicorn.access,httpx}
      # An interactive root shell on this machine, reachable from the node page
      # in the UI. OFF, and it should stay off unless you want it: the /api
      # surface has no authentication, the gateway binds 0.0.0.0, and this
      # container runs as root with --pid=host and the operator's SSH keys
      # mounted -- so an enabled shell reaches the host, and through those keys
      # the rest of the fleet. Both variables are required; the key is never
      # returned by any route, and is generated into /data/shell.key if unset.
      DERATE_SHELL: ${DERATE_SHELL:-0}
      DERATE_SHELL_KEY: ${DERATE_SHELL_KEY:-}
      # Browser origins allowed to open a shell socket. Empty means no check,
      # which is right when the UI is served by this coordinator. Set it if you
      # reach the UI from somewhere else: a WebSocket handshake is exempt from
      # CORS and is never preflighted, so this is the only thing that stops a
      # page you happen to visit opening a socket to your LAN.
      DERATE_SHELL_ORIGINS: ${DERATE_SHELL_ORIGINS:-}
      # Seconds of inactivity before a shell session closes itself.
      DERATE_SHELL_IDLE_S: ${DERATE_SHELL_IDLE_S:-1800}

    healthcheck:
      # /agent/health exists in both roles. /api/cluster is coordinator-only
      # and would mark every worker unhealthy.
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:${DERATE_AGENT_PORT:-8081}/agent/health ||
          curl -fsS http://127.0.0.1:${DERATE_PORT:-8080}/agent/health
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  derate:
