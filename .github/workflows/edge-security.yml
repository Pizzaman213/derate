# The WAN edge (DERATE_EDGE_PORT), attacked on every pull request.
#
# The edge is the one socket the internet reaches through a Cloudflare Tunnel,
# so its rules -- /v1 only, the caller is CF-Connecting-IP and nothing else, a
# throttle on refused keys, media URLs that cannot name the LAN -- get their
# own job rather than waiting for the push-only suite in publish-image.yml.
#
# Two layers. The unit tests attack the gate in-process: forged forwarding
# headers, lookalike keys, /api dressed as /v1, SSRF spellings. Then a real
# coordinator is started with an edge port and tests/edge_probe.py attacks the
# socket itself: raw request lines no HTTP client would send, pipelining,
# CL.TE/TE.CL smuggling, Host games. The probe is also how an operator checks
# a live tunnel: `python3 -m tests.edge_probe --via tunnel --edge https://...`.
#
# Every action is pinned by commit SHA with the tag it resolved from, the same
# pins publish-image.yml uses.
name: edge-security

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: edge-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest>=9"

      # From the repo root: pyproject sets pythonpath = ["."].
      - name: Gate and spoofing tests
        run: |
          python -m pytest -q -rs \
            tests/unit/test_edge_spoofing.py \
            tests/unit/test_media_urls.py \
            tests/unit/test_gateway_auth_coverage.py \
            tests/unit/test_gateway_security_gate.py \
            tests/unit/test_auth_hardening.py \
            tests/unit/test_trusted_proxies.py \
            tests/unit/test_keys.py \
            tests/unit/test_forensics.py

      # 18080/18081/18082, a throwaway data dir, and a forced role so the
      # mDNS browse cannot make this anything but a lone coordinator.
      - name: Start coordinator with an edge port
        run: |
          set -e
          DERATE_ROLE=coordinator DERATE_PORT=18080 DERATE_AGENT_PORT=18081 \
            DERATE_EDGE_PORT=18082 DERATE_DATA_DIR="$RUNNER_TEMP/edge-data" \
            DERATE_LOG_DIR="$RUNNER_TEMP/edge-logs" \
            nohup python3 -m control_plane.node > "$RUNNER_TEMP/coordinator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/coordinator.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/healthz > /dev/null; then
              echo "coordinator up after ${i}s"
              grep -q "edge listener on 127.0.0.1:18082" "$RUNNER_TEMP/coordinator.log" \
                || { echo "no edge listener in the log"; cat "$RUNNER_TEMP/coordinator.log"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "coordinator never came up:"
          cat "$RUNNER_TEMP/coordinator.log"
          exit 1

      # The first admin's response carries the default key, once. Both are
      # masked: the log of a public repository is public.
      - name: Bootstrap an admin and a key
        run: |
          set -e
          PW="ci-edge-$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          KEY=$(curl -sf -X POST http://127.0.0.1:18080/api/setup/admin \
            -H 'content-type: application/json' \
            -d "{\"username\":\"ci\",\"email\":\"ci@derate.test\",\"password\":\"$PW\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["secret_once"])')
          echo "::add-mask::$KEY"
          { echo "EDGE_ADMIN_PASSWORD=$PW"; echo "EDGE_KEY=$KEY"; } >> "$GITHUB_ENV"

      - name: Attack the edge socket
        run: |
          python -m tests.edge_probe --via direct \
            --edge http://127.0.0.1:18082 --key "$EDGE_KEY" \
            --main http://127.0.0.1:18080 --admin-user ci --admin-password "$EDGE_ADMIN_PASSWORD"

      - name: Coordinator log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/coordinator.log" || true

      - name: Stop coordinator
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/coordinator.pid")" 2>/dev/null || true
