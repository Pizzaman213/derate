# Publishes ghcr.io/pizzaman213/derate/node -- the image every node pulls.
#
# The README's one-liner is only true if this workflow succeeds. install.sh
# defaults to :latest from this registry, so a stranger's `curl ... | sh` is
# downstream of this file. Both architectures, always: GB10 is arm64 and the
# workstation is usually amd64, and an image missing one means the
# heterogeneous case does not work at all.
#
# Nothing used to run between checkout and push. A broken commit on
# `integration` became the :latest image every node pulls, on machines nobody
# is watching, and the first sign of it was an install failing in somebody
# else's house. The `verify` job below is that missing gate: publish `needs` it,
# so a red suite or a red typecheck stops the push instead of shipping.
#
# GITHUB_TOKEN carries packages:write through the permissions block below, so
# this needs no PAT and no repository secret. Package *visibility* is the one
# thing it cannot set: after the first successful run, flip the package to
# public once, or an anonymous `docker pull` returns a 401 that reads exactly
# like the "repository does not exist" failure this replaces.
name: publish image

on:
  push:
    branches: [integration, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/pizzaman213/derate/node

jobs:
  # Everything that can fail without hardware. Cheap relative to a two-arch
  # buildx run, and it fails in about three minutes instead of twelve.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=9"

      # From the repo root, always: pyproject sets pythonpath = ["."], so
      # anywhere else nothing imports and every test errors identically.
      - name: Tests
        run: python -m pytest -q -m "not slow"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI
        working-directory: ui
        run: npm ci

      # `tsc -b`. A bare `npx tsc --noEmit` typechecks NOTHING here -- the root
      # tsconfig is {"files": [], "references": [...]} and exits 0 on any tree,
      # which is a gate that always passes.
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Build UI
        working-directory: ui
        run: npm run build

      # There is no UI test runner. The *.check.mjs verifiers ARE the UI's
      # test suite, and each exists because a class of bug is invisible to
      # types: the URL scheme, the graph layout, the quantization ladder, the
      # QR encoder.
      #
      # This step used to discover them here and carry its own `case` statement
      # deciding which to skip -- a second copy of a fact each verifier already
      # states in its header, and one that was already wrong: registry needs a
      # live coordinator and was not on the list.
      #
      # Both now live in ui/check.mjs, which reads each file's `// requires:`
      # line, probes once, and reports a skip as a skip. A runner has no
      # coordinator, no captured fixtures and no browser, so those verifiers
      # skip here and are named in the output rather than counted as passes.
      - name: Verifiers
        working-directory: ui
        run: npm run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # amd64 is native on this runner; arm64 is emulated. The UI stage is
      # pinned to $BUILDPLATFORM in the Dockerfile, so npm runs once, natively,
      # and only apt and pip go through QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # :latest tracks `integration`, not the default branch -- that is the
          # branch install.sh and enroll_api.INSTALL_BRANCH both point at. Move
          # both when integration lands on main.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/integration' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
