# Publishes ghcr.io/pizzaman213/derate/node -- the image every node pulls.
#
# The README's one-liner is only true if this workflow succeeds. install.sh
# defaults to :latest from this registry, so a stranger's `curl ... | sh` is
# downstream of this file. Both architectures, always: GB10 is arm64 and the
# workstation is usually amd64, and an image missing one means the
# heterogeneous case does not work at all.
#
# GITHUB_TOKEN carries packages:write through the permissions block below, so
# this needs no PAT and no repository secret. Package *visibility* is the one
# thing it cannot set: after the first successful run, flip the package to
# public once, or an anonymous `docker pull` returns a 401 that reads exactly
# like the "repository does not exist" failure this replaces.
name: publish image

on:
  push:
    branches: [integration, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/pizzaman213/derate/node

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # amd64 is native on this runner; arm64 is emulated. The UI stage is
      # pinned to $BUILDPLATFORM in the Dockerfile, so npm runs once, natively,
      # and only apt and pip go through QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # :latest tracks `integration`, not the default branch -- that is the
          # branch install.sh and enroll_api.INSTALL_BRANCH both point at. Move
          # both when integration lands on main.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/integration' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
