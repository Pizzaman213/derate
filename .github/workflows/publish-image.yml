# Publishes ghcr.io/pizzaman213/derate/node -- the image every node pulls.
#
# The README's one-liner is only true if this workflow succeeds. install.sh
# defaults to :latest from this registry, so a stranger's `curl ... | sh` is
# downstream of this file. Both architectures, always: GB10 is arm64 and the
# workstation is usually amd64, and an image missing one means the
# heterogeneous case does not work at all.
#
# Nothing used to run between checkout and push. A broken commit on the
# default branch became the :latest image every node pulls, on machines
# nobody is watching, and the first sign of it was an install failing in
# somebody else's house. The `verify` job below is that missing gate: publish
# `needs` it, so a red suite or a red typecheck stops the push instead of
# shipping.
#
# GITHUB_TOKEN carries packages:write through the permissions block below, so
# this needs no PAT and no repository secret. Package *visibility* is the one
# thing it cannot set: after the first successful run, flip the package to
# public once, or an anonymous `docker pull` returns a 401 that reads exactly
# like the "repository does not exist" failure this replaces.
#
# `dev` builds too, into a package of its own: derate/node-dev. Deliberately
# not a :dev tag on derate/node -- the two would share one package page and one
# `docker pull`-shaped mistake, and install.sh defaults to
# `ghcr.io/pizzaman213/derate/node:latest`, so the cost of confusing them is a
# stranger's cluster running unreviewed code. Two names cannot be confused by a
# typo. Within node-dev, :latest means the newest dev build, which is what
# somebody testing one wants to type:
#
#     DERATE_IMAGE=ghcr.io/pizzaman213/derate/node-dev:latest ./install.sh
#
# node-dev needed no flip. A package GHCR sees for the first time from a
# workflow inherits the repository's visibility, and this repository is public,
# so the pull above worked the moment the first run finished -- checked with an
# anonymous token against the registry, not assumed. The paragraph above still
# holds for a package that arrives any other way, and it is worth keeping: the
# 401 it describes reads exactly like a name that does not exist.
#
# `verify` is the better half of why dev is on the list: the check now runs on
# the branch the work is on, instead of first reporting on main, where a red
# suite is already merged.
#
# `verify` used to build the UI and run its checks against nothing -- no
# coordinator was ever listening, so every verifier that needs one
# (registry, rows, voices, allowlist, the browser-driven screens) skipped
# silently instead of running. It now boots a real, isolated coordinator
# first (ports 18080/18081, a throwaway data dir -- never :8080/:8088, which
# a real node might be using) and runs `npm run check -- --strict`, which
# turns a forgotten wire-up back into a red build. A new route-smoke step
# drives every method+path `control_plane/contracts/routes.json` declares
# against that same coordinator and fails on a 5xx -- the one thing nothing
# else in this workflow sends a real HTTP request to check.
#
# Neither of those needs a GPU or `sparkrun`: they prove the gateway's own
# surface still answers, not that a launch still works. Proving a real
# launch still works -- sparkrun, docker, vLLM, a real generated token --
# needs actual GPU hardware this workflow does not have and deliberately
# does not reach for with a self-hosted runner (a public repo's own risk).
# tests/unit/test_gateway.py::test_a_real_tiny_model_launches_and_answers
# does that check; it stays a `slow`-marked manual run against a real
# coordinator (DERATE_E2E_ORIGIN), the same way the TTS/Whisper round trip
# already does, rather than a gate on this file.
name: publish image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # One package per branch, resolved once here. dev builds derate/node-dev;
  # main, a version tag and a manual dispatch build derate/node, which is what
  # install.sh pulls and what every enrolled node is already running.
  IMAGE: ghcr.io/pizzaman213/derate/node${{ github.ref == 'refs/heads/dev' && '-dev' || '' }}

jobs:
  # Everything that can fail without hardware. Cheap relative to a two-arch
  # buildx run, and it fails in about three minutes instead of twelve.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=9"

      # From the repo root, always: pyproject sets pythonpath = ["."], so
      # anywhere else nothing imports and every test errors identically.
      - name: Tests
        run: python -m pytest -q -m "not slow"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI
        working-directory: ui
        run: npm ci

      # `tsc -b`. A bare `npx tsc --noEmit` typechecks NOTHING here -- the root
      # tsconfig is {"files": [], "references": [...]} and exits 0 on any tree,
      # which is a gate that always passes.
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Build UI
        working-directory: ui
        run: npm run build

      # screens.check.mjs drives "the Chromium already in the Playwright
      # cache" -- true on a machine that has run `npm run screens` before,
      # never true on a fresh runner.
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # Isolated on purpose: 18080/18081, never 8080/8088, so this can never
      # collide with a real node. DERATE_ROLE is left unset -- the same
      # ~3s-mDNS-timeout-then-self-promote role resolution a lone real node
      # already goes through (control_plane/registry/bootstrap.py) -- and
      # DERATE_UI_DIR points at the dist this job just built, so the
      # verifiers below see the UI this push would actually ship.
      - name: Start coordinator
        run: |
          set -e
          DERATE_ROLE=auto DERATE_PORT=18080 DERATE_AGENT_PORT=18081 \
            DERATE_DATA_DIR="$RUNNER_TEMP/derate-ci-data" \
            DERATE_UI_DIR="$GITHUB_WORKSPACE/ui/dist" \
            nohup python3 -m control_plane.node > "$RUNNER_TEMP/coordinator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/coordinator.pid"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/v1/models > /dev/null; then
              echo "coordinator up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "coordinator never came up:"
          cat "$RUNNER_TEMP/coordinator.log"
          exit 1

      # There is no UI test runner. The *.check.mjs verifiers ARE the UI's
      # test suite, and each exists because a class of bug is invisible to
      # types: the URL scheme, the graph layout, the quantization ladder, the
      # QR encoder.
      #
      # This step used to discover them here and carry its own `case` statement
      # deciding which to skip -- a second copy of a fact each verifier already
      # states in its header, and one that was already wrong: registry needs a
      # live coordinator and was not on the list.
      #
      # Both now live in ui/check.mjs, which reads each file's `// requires:`
      # line, probes once, and reports a skip as a skip. A coordinator is up
      # and a browser is installed above, so --strict turns any remaining
      # skip into a failure instead of a silent pass.
      - name: Verifiers
        working-directory: ui
        env:
          DERATE_CHECK_ORIGIN: http://localhost:18080
        run: npm run check -- --strict

      # Every method+path control_plane/contracts/routes.json declares,
      # fired at the coordinator started above. A liveness check, not a
      # correctness check -- a 404 on a made-up resource id is the right
      # answer; only a 5xx fails. See tests/unit/test_route_smoke.py.
      - name: API route smoke test
        env:
          DERATE_E2E_ORIGIN: http://localhost:18080
        run: python -m pytest -q -m slow tests/unit/test_route_smoke.py

      - name: Stop coordinator
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/coordinator.pid")" 2>/dev/null || true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image has no .git -- .dockerignore drops it -- so version.py's
      # second source cannot run inside a published container and build_id()
      # answers "", which renders as "an unidentified build" on every node
      # running an image from this workflow. docker/build.sh has always
      # stamped it and CI never did. `--short=12` is build.sh's length and
      # version.py's SHA_LENGTH, so both paths name the same commit the same
      # way. It matters more now that :dev and :latest both float: the tag a
      # node pulled is not recoverable from the node, only the build is.
      - id: build
        run: echo "id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # amd64 is native on this runner; arm64 is emulated. The UI stage is
      # pinned to $BUILDPLATFORM in the Dockerfile, so npm runs once, natively,
      # and only apt and pip go through QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # :latest is the newest build of whichever package this is -- main's
          # for node, dev's for node-dev. It cannot cross between them: the
          # image name did the separating before this rule is read, which is
          # the whole reason dev has a package rather than a tag. install.sh
          # and enroll_api.INSTALL_BRANCH resolve node:latest, and only a push
          # to main can move it.
          #
          # The branch tag stays alongside it, so the same digest is also
          # addressable as node-dev:dev by where it came from rather than by
          # how recent it is.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DERATE_BUILD=${{ steps.build.outputs.id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
