[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "derate"
version = "0.0.1"
description = "Planning and orchestration for DGX Spark clusters"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Kept in step with requirements.txt, which the Dockerfile installs through
# requirements.lock. Both lists exist on purpose: the image pins from the lock without
# building this package, and a native `pip install .` on a laptop has no
# Dockerfile to read. They must be changed together:
# tests/unit/test_single_source.py compares the two lists and fails on drift.
dependencies = [
    "fastapi==0.165.0",
    "starlette>=1.3.1",
    "h11>=0.16.0",
    "uvicorn[standard]==0.34.0",
    "websockets==15.0.1",
    "httpx==0.28.1",
    "anyio==4.14.2",
    "pydantic==2.10.4",
    "zeroconf==0.149.16",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    # Host facts -- memory, CPU, process liveness and process kill -- on the
    # two platforms with no /proc. The Linux readers stay as they are; see
    # registry/hostfacts.py for why this is not used to replace them.
    "psutil==7.2.2",
    # Admin passwords are argon2id. No fallback hasher: see control_plane/auth.
    "argon2-cffi==25.1.0",
    # The ChatGPT sign-in's ID-token check, and its RS256/ES256 backend.
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.0",
    # Weight prefetch; requirements.txt says why it is named.
    "huggingface-hub==1.8.0",
    # The cluster launcher; requirements.txt says why it is pinned.
    "sparkrun==0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff"]

[project.scripts]
# The native install path. `python -m control_plane.node` still works and is
# what the container entrypoint execs; this exists so that a machine with no
# Docker has something to type.
derate = "control_plane.node:main"

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.pytest.ini_options]
# Every agent runs pytest from the repo root. Without this, `control_plane`
# and `tests.fixtures` do not import and the T+8h checkpoint fails for
# reasons that have nothing to do with anyone's code.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: minutes, not seconds. Deselect with -m 'not slow'.",
    "raw_http: no automatic admin session or API key is attached (tests/unit/conftest.py).",
]

[tool.ruff]
line-length = 100
target-version = "py312"
